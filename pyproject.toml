[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overlaybuilder"
version = "0.2.0"
description = "Build ATAK-ready critical-infrastructure overlays (KMZ) from public GIS data, for any county, state, country, or the world."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nordic Development Industries" }]
keywords = ["ATAK", "TAK", "GIS", "KMZ", "critical infrastructure", "EIA", "HIFLD", "OpenStreetMap", "TIGER", "overlays"]
dependencies = [
    "pyshp>=2.3",
    "pyproj>=3.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pbf = ["osmium>=3.6"]          # osm_pbf driver: nation/continent/planet extracts offline
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/NordicDevelopment-org/ATAK-Overlays"
Issues = "https://github.com/NordicDevelopment-org/ATAK-Overlays/issues"

[project.scripts]
overlaybuilder = "overlaybuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
