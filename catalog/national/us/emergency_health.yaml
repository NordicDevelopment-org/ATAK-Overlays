    notes: "Field names are lowercase on this mirror (level_ = licensure level) || HOST DEAD 2026-09-14: maps.nccs.nasa.gov no longer resolves ('ping: unknown host', 'curl: Could not resolve host') - not blocked, not IPv6; the NASA NCCS re-host of HIFLD Open is gone from DNS. Disabled until a live mirror is found."
