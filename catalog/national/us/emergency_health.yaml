# US national tier - EMERGENCY SERVICES, HEALTH, GOVERNMENT.
#
# Status (Sept 2026): HIFLD Open was decommissioned 26 Aug 2025; ~254 of its
# layers (hospitals, fire, EMS, law enforcement, prisons, local EOCs, nursing
# homes, urgent care, pharmacies) were discontinued, not migrated. Two kinds of
# sources remain and BOTH are wired here so the reconcile report can compare:
#   1. NASA NCCS re-host of the final HIFLD Open snapshot (rich attributes -
#      beds, trauma, helipad, FDID - but FROZEN; check SOURCEDATE)
#   2. Live federal successors: USGS National Map Structures (points, few
#      attributes), FEMA (state EOCs, National Shelter System), NCES (schools)
# OSM (global tier) is the third, community-maintained view.
defaults:
  sector: Emergency & Health
  spatial: bbox
  driver: arcgis
  license: "Public domain (US Government work)"
sources:
  # ---------------- hospitals ----------------
  - layer: hospitals
    id: hospitals@hifld-nasa
    provider: hifld
    entity: hospital
    url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    layer_match: "^hospitals$"
    where_by_aoi:
      county: "COUNTYFIPS = '{fips5}'"
      state: "STATE = '{state_abbr}'"
      region: "STATE IN ({states_sql})"
    group_by: [type]
    name: "{name} ({beds} beds)"
    fields:
      name: {from: [NAME]}
      beds: {from: [BEDS]}
      trauma: {from: [TRAUMA]}
      helipad: {from: [HELIPAD]}
      staff: {from: [TTL_STAFF]}
      type: {from: [TYPE]}
      owner: {from: [OWNER]}
      status: {from: [STATUS]}
      phone: {from: [TELEPHONE]}
      address: {from: [ADDRESS]}
    style_rules:
      - {when: "trauma ~ LEVEL I", color: "ff0000ff", icon: plus, width: 3}
    source_name: "HIFLD Hospitals (final HIFLD Open snapshot, NASA NCCS re-host)"
    source_url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    license: "Public domain (US Government work) - unofficial re-host; frozen snapshot, check SOURCEDATE"
    notes: "BEDS, TRAUMA, HELIPAD, TTL_STAFF, OWNER, NAICS_DESC in attributes. -999 = not available || HOST DEAD 2026-09-14: maps.nccs.nasa.gov no longer resolves ('ping: unknown host', 'curl: Could not resolve host') - not blocked, not IPv6; the NASA NCCS re-host of HIFLD Open is gone from DNS. Disabled until a live mirror is found."
    confidence: dead
    alternates:
      - {driver: file, url: "https://source.coop/seerai/hifld", note: "SeerAI GeoParquet archive of the same snapshot, CC BY 4.0"}
    enabled: false

  - layer: hospitals
    id: hospitals@usgs
    provider: usgs
    entity: hospital
    url: https://carto.nationalmap.gov/arcgis/rest/services/structures/MapServer
    layer_match: "^Hospitals/Medical Centers$"
    where_by_aoi:
      state: "STATE = '{state_abbr}'"
      region: "STATE IN ({states_sql})"
    fields:
      name: {from: [NAME]}
      address: {from: [ADDRESS]}
      source_id: {from: [GNIS_ID]}
      type: {from: [FCODE]}
    source_name: "USGS National Map Structures - Hospitals/Medical Centers (live)"
    source_url: https://www.usgs.gov/programs/national-geospatial-program/national-structures-dataset
    notes: "Maintained federal successor for facility points; no bed/trauma attributes (see HIFLD snapshot / CMS). Duplicate scale-dependent layer ids exist; matched by name"
    confidence: high

  - layer: nursing_homes
    id: nursing_homes@hifld-nasa
    provider: hifld
    url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    layer_match: "^nursing_homes$"
    where_by_aoi:
      county: "countyfips = '{fips5}'"
      state: "state = '{state_abbr}'"
    hidden: true
    fields:
      name: {from: [name, NAME]}
      beds: {from: [beds, BEDS]}
      population: {from: [tot_res]}
      staff: {from: [tot_staff]}
      type: {from: [type, TYPE]}
      owner: {from: [ownership, OWNER]}
      source_id: {from: [medicareid]}
    source_name: "HIFLD Nursing Homes (final snapshot, NASA NCCS re-host)"
    source_url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    license: "Public domain (US Government work) - unofficial re-host; frozen"
    notes: "Field names are lowercase on this mirror. CMS Nursing Home Provider Information (data.cms.gov, has lat/lon + certified beds) is the live successor - roadmap || HOST DEAD 2026-09-14: maps.nccs.nasa.gov no longer resolves ('ping: unknown host', 'curl: Could not resolve host') - not blocked, not IPv6; the NASA NCCS re-host of HIFLD Open is gone from DNS. Disabled until a live mirror is found."
    confidence: dead
    enabled: false

  - layer: urgent_care
    id: urgent_care@hifld-nasa
    provider: hifld
    url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    layer_match: "^urgent_care"
    where_by_aoi:
      county: "COUNTYFIPS = '{fips5}'"
      state: "STATE = '{state_abbr}'"
    hidden: true
    source_name: "HIFLD Urgent Care Facilities (final snapshot, NASA NCCS re-host)"
    source_url: https://maps.nccs.nasa.gov/mapping/rest/services/hifld_open/public_health/FeatureServer
    license: "Public domain (US Government work) - unofficial re-host; frozen"
    confidence: dead

    notes: "HOST DEAD 2026-09-14: maps.nccs.nasa.gov no longer resolves ('ping: unknown host', 'curl: Could not resolve host') - not blocked, not IPv6; the NASA NCCS re-host of HIFLD Open is gone from DNS. Disabled until a live mirror is found."
    enabled: false

